# S1: freeze the matched B3 backbone and learn only a Map-specific residual
# correction to epsilon prediction.  The path-count branch remains exactly B3.
statistics_path: artifacts/statistics/diffusion_seen_map_s1_residual.json
statistics_batch_size: 512

multipath_diffusion:
  max_paths: 5
  hidden_dim: 256
  condition_embedding_dim: 128
  layers: 4
  attention_heads: 8
  dropout: 0.05
  diffusion_steps: 1000
  cosine_offset: 0.008
  clip_denoised: 5.0
  condition_dropout: 0.10
  path_count_loss_weight: 1.0
  scene_conditioning:
    enabled: false
  scene_residual_adapter:
    enabled: true
    map_id_to_index: {}
    embedding_dim: 32
    hidden_dim: 128
    layers: 2
    attention_heads: 4
    dropout: 0.05
    residual_scale: 1.0
    freeze_backbone: true
  spatial_supervision:
    enabled: false
  path_count:
    class_weight_power: 0.5
    max_weight_ratio: 4.0
    prior_correction: true
    label_smoothing: 0.01
  parameterization:
    mode: structured
    structured_delay: true
    structured_power: true
    structured_k_factor: true
    epsilon: 1.0e-20
  constraints:
    enforce_total_power: true
    enforce_delay_spread: true
    enforce_k_factor: true
    enforce_los_direct_path: true
    epsilon: 1.0e-20

sampling:
  sampler: ddim
  sampling_steps: 100
  eta: 0.0
  guidance_scale: 1.0
  path_count_temperature: 1.0

train:
  seed: 2026
  device: auto
  epochs: 21
  batch_size: 256
  num_workers: 4
  learning_rate: 2.0e-4
  weight_decay: 1.0e-5
  gradient_clip_norm: 1.0
  mixed_precision: false
  ema_decay: 0.999
  patience: 20
  lr_patience: 6
  lr_reduce_factor: 0.5
  checkpoint_dir: artifacts/checkpoints/b3_s1_scene_residual
  log_every_steps: 20
