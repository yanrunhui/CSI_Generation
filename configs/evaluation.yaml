evaluation:
  batch_size: 512
  condition_tolerances:
    total_power_db: 0.25
    delay_spread_ns: 2.0
    k_factor_db: 0.5
  mmd_kernel_bandwidths: [0.1, 0.5, 1.0, 2.0, 5.0]
  nearest_neighbor_k: 5
  rare_condition_quantiles: [0.2, 0.8]
  histogram_bins: 50
  resampling:
    method: kernel
    threshold: [3.0, 15.0, 3.0, 0.0]
    kernel_bandwidth: [5.0, 30.0, 3.0, 0.1]

